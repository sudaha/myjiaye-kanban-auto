name: sync-kanban

# 佳业采购雷达自动同步：每天 4 次（北京时间 9:00 / 13:00 / 17:00 / 22:00 = UTC 1 / 5 / 9 / 12 点）
# 增量抓央采电子询价 → 导出静态站 → 部署 Cloudflare Pages
# 另有 workflow_dispatch 可手动立即触发
on:
  schedule:
    - cron: "0 1,5,9,12 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    permissions:
      contents: write  # 允许把新 PDF/数据库/基线回写仓库
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 增量抓取央采电子询价（14 天窗口，按 id 去重；失败不阻塞，沿用库内数据继续部署）
      - name: fetch zycg enquiries
        run: python fetcher.py || echo "[warn] 央采抓取失败（限流/网络），沿用库内数据"

      # 导出静态站（含最近 3 日期规则、is_new 新增标注、基线更新）
      - name: export static site
        run: python export_static.py dist

      # 部署
      - name: deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          wrangler pages deploy dist --project-name=myjiaye-kanban

      # 新 PDF / 数据库 / 新增基线回写仓库，供下次运行与 PDF 下载
      - name: commit new data back to repo
        run: |
          git config user.name "kanban-sync-bot"
          git config user.email "sync@users.noreply.github.com"
          git add data/pdfs data/board.db data/last_seen_zycg.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto sync $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
