<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>央采电子询价 · 佳业采购雷达</title>
  <link rel="icon" href="/jiaye_logo.jpg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/extra.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <img class="logo" src="/jiaye_logo.jpg" alt="佳业科技">
      <div>
        <h1>央采电子询价 · 佳业采购雷达</h1>
        <p class="sub">中央政府采购网 · 电子询价「需求公告」实时监测</p>
      </div>
    </div>
    <div class="statusbox">
      <div class="stat">
        <span class="num" id="st-total">-</span><span class="lab" id="st-total-lab">公告总数</span>
      </div>
      <div class="stat">
        <span class="num" id="st-active">-</span><span class="lab" id="st-active-lab">进行中</span>
      </div>
      <div class="stat">
        <span class="num" id="st-latest">-</span><span class="lab" id="st-latest-lab">最新日期</span>
      </div>
    </div>
  </div>
</header>

<section id="win-ticker" class="win-ticker hide" aria-label="中标喜讯">
  <div class="win-ticker-label">中标喜讯</div>
  <div class="win-ticker-window"><div id="win-ticker-track" class="win-ticker-track"></div></div>
</section>

<div class="wrap">
  <nav class="plats" id="plats">
    <button class="plat on" data-plat="zycg">央采电子询价<span class="badge-n" id="n-zycg">-</span></button>
    <button class="plat" data-plat="rail">国铁商城批采<span class="badge-n" id="n-rail">-</span></button>
    <button class="plat" data-plat="poly">保利集团招标<span class="badge-n" id="n-poly">-</span></button>
    <button class="plat" data-plat="picker">选型助手<span class="badge-n" id="n-picker">-</span></button>
    <button class="plat" data-plat="records">参与投标记录<span class="badge-n" id="n-records">-</span></button>
    <button class="plat" data-plat="docs">商务单证</button>
    <span class="plat-hint" id="plat-hint"></span>
  </nav>

  <section id="rail-source-status" class="rail-source-status hide">
    <button type="button" class="rail-source-btn on" data-source="">全部项目 <span id="rail-source-all">-</span></button>
    <button type="button" class="rail-source-btn" data-source="cg_">国铁采购平台公开招投标 <span id="rail-source-cg">-</span></button>
    <button type="button" class="rail-source-btn" data-source="mall_">国铁商城批量采购专区 <span id="rail-source-mall">-</span></button>
  </section>

  <section id="zycg-source-status" class="rail-source-status hide">
    <button type="button" class="rail-source-btn zycg-source-btn on" data-source="">全部 <span id="zycg-source-all">-</span></button>
    <button type="button" class="rail-source-btn zycg-source-btn" data-source="询价">电子询价 <span id="zycg-source-xj">-</span></button>
    <button type="button" class="rail-source-btn zycg-source-btn" data-source="委托">单独委托项目 <span id="zycg-source-wt">-</span></button>
  </section>

  <section class="filterbar" id="filterbar">
    <input type="search" id="f-keyword" placeholder="搜索标题 / 采购公司 / 品牌…" class="f-key">
    <select id="f-category"><option value="">全部品类</option></select>
    <select id="f-status">
      <option value="">全部状态</option>
      <option value="进行中">进行中</option>
      <option value="已截止">已截止</option>
    </select>
    <label class="itchk" id="f-it-wrap"><input type="checkbox" id="f-it"> 只看 IT 相关</label>
    <div class="notice-date-picker" id="notice-date-picker">
      <button type="button" id="f-date-btn" class="date-trigger" title="只显示有公告的日期">选择公告日期</button>
      <input type="hidden" id="f-date" value="">
      <div id="date-pop" class="date-pop hide" role="dialog" aria-label="公告日期选择">
        <div class="date-head"><button type="button" id="date-prev" aria-label="上个月">‹</button><b id="date-month"></b><button type="button" id="date-next" aria-label="下个月">›</button></div>
        <div class="date-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div id="date-grid" class="date-grid"></div>
        <div class="date-foot"><button type="button" id="date-clear">清除</button><span>仅亮显有公告日期</span></div>
      </div>
    </div>
    <button id="f-search" class="btn primary">查询</button>
    <button id="f-reset" class="btn ghost">重置</button>
    <button id="f-refresh" class="btn ghost" title="立即抓取最新公告">↻ 刷新数据</button>
  </section>

  <div class="batchbar" id="batchbar">
    <label class="selall"><input type="checkbox" id="sel-all"> 全选本页</label>
    <button id="btn-zip" class="btn primary" disabled>⬇ 打包下载选中 PDF</button>
    <span class="muted">可跨页面、品类多选下载</span>
    <span class="muted" id="sel-info">已选 0 项</span>
    <span class="muted" id="zip-progress"></span>
  </div>

  <div class="meta-line">
    <span id="result-count"></span>
    <span id="upd-time" class="muted"></span>
  </div>

  <!-- 选型助手（第三板块：基于央采卖场真实成交记录建库，独立于央采/保利公告列表） -->
  <section id="pickerbox" class="pickerbox hide">
    <div class="pick-tabs">
      <button class="ptab on" data-pane="text">粘贴需求文本</button>
      <button class="ptab" data-pane="notice">央采项目选择</button>
      <button class="ptab" data-pane="browse">浏览机型库</button>
    </div>

    <div class="pick-pane" id="ppane-text">
      <textarea id="pick-text" rows="7" placeholder="把询价通知书 / 招标文件里的需求文字粘贴到这里，例如：&#10;采购信创台式计算机 100 台，要求：海光 C86-4G 处理器 / 16G 内存 / 512G 固态硬盘 + 1T 机械硬盘 / 麒麟操作系统 / 品牌限联想、华为&#10;预算：850 万元"></textarea>
      <div class="pick-actions">
        <button id="pick-run" class="btn primary">开始选型</button>
        <span id="pick-summary" class="muted"></span>
      </div>
    </div>

    <div class="pick-pane hide" id="ppane-notice">
      <div class="notice-search-row">
        <input type="search" id="pick-notice-key" class="pick-notice-key" placeholder="搜索标题 / 采购公司 / 品牌 / 品类…">
        <span id="pick-notice-count" class="muted"></span>
      </div>
      <div class="notice-row">
        <select id="pick-notice-cat" class="pick-select br-cat" title="按项目类型筛选"></select>
        <select id="pick-notice" class="pick-select"></select>
        <button id="pick-notice-run" class="btn primary">按技术参数选型</button>
      </div>
      <span id="pick-notice-summary" class="muted">选择公告后，将从采购需求附件中提取技术参数、品牌和指定型号，推荐倾向性更强的具体配置。</span>
      <div class="notice-workbench">
        <aside id="pick-notice-list" class="notice-list" aria-label="公告列表"></aside>
        <div id="pick-notice-analysis" class="notice-analysis"><div class="pick-empty">请从左侧选择公告，查看技术参数和具体型号推荐</div></div>
      </div>
    </div>

    <div class="pick-pane hide" id="ppane-browse">
      <div class="notice-row">
        <select id="br-cat"></select>
        <select id="br-brand"></select>
        <input type="search" id="br-key" placeholder="搜索型号 / 规格 / 供应商…">
        <button id="br-run" class="btn primary">查询</button>
        <span id="br-info" class="muted"></span>
      </div>
      <div id="br-table"></div>
    </div>

    <div id="pick-results"></div>
  </section>

  <!-- 商务单证（报价单 / 货物签收单） -->
  <section id="docsbox" class="docsbox hide">
    <div class="pick-tabs">
      <button class="docs-tab on" data-doc="quote">报价单</button>
      <button class="docs-tab" data-doc="receipt">货物签收单</button>
    </div>
    <div id="docs-hint" class="docs-hint muted"></div>
    <textarea id="docs-input" rows="12"></textarea>
    <div class="pick-actions">
      <button id="docs-gen" class="btn primary">📄 生成正式文件</button>
      <span id="docs-msg" class="muted"></span>
    </div>
    <div id="docs-actions" class="hide">
      <button id="docs-dl-1" class="btn primary hide"></button>
      <button id="docs-dl-2" class="btn hide"></button>
      <button id="docs-dl-3" class="btn hide"></button>
      <button id="docs-dl-4" class="btn hide"></button>
    </div>
    <div id="docs-preview" class="hide"></div>
  </section>

  <section id="recordsbox" class="recordsbox hide"></section>

  <main id="list" class="list"></main>

  <div class="pager" id="pager">
    <button id="pg-prev" class="btn ghost">上一页</button>
    <span id="pg-info"></span>
    <button id="pg-next" class="btn ghost">下一页</button>
  </div>
</div>

<!-- 详情弹层 -->
<div class="overlay" id="overlay">
  <div class="detail" id="detail">
    <button class="close" id="d-close">✕</button>
    <div id="d-body"></div>
  </div>
</div>

<footer class="foot">
  <div class="wrap muted" id="foot-note">数据来源：中央政府采购网电子询价接口 · 每天 9/13/17/22 点自动更新</div>
</footer>

<script src="/app.js"></script>
<script src="/jszip.min.js"></script>
<script src="/docs.js"></script>
<script src="/docs_v3.js"></script>

<!-- 登录门：密码不存网页，只存 SHA-256 哈希；当次会话免重复输入 -->
<style>
  #gate { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #eef7f4, #f6faf9); }
  #gate.gate-hide { display: none; }
  .gate-box { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg);
    padding: 38px 42px; width: 340px; text-align: center; }
  .gate-logo { height: 64px; margin: 0 auto; display: block; }
  .gate-box h2 { margin: 14px 0 4px; font-size: 20px; }
  .gate-box input { width: 100%; padding: 10px 12px; margin: 14px 0; border: 1px solid var(--line);
    border-radius: 9px; font-size: 14px; box-sizing: border-box; }
  .gate-err { color: #d4380d; font-size: 13px; margin-top: 10px; }
  .gate-err.hide { display: none; }
</style>
<div id="gate" class="gate-hide">
  <div class="gate-box">
    <img class="gate-logo" src="/jiaye_logo.jpg" alt="佳业科技">
    <h2>佳业采购雷达</h2>
    <div class="muted">内部数据看板，请输入访问密码</div>
    <form id="gate-form">
      <input type="password" id="gate-pw" placeholder="访问密码" autocomplete="current-password" autofocus>
      <button type="submit" class="btn primary" style="width:100%">进入看板</button>
    </form>
    <div class="gate-err hide" id="gate-err">密码错误，请重试</div>
  </div>
</div>
<script>
(function () {
  var HASH = "84983c60f7daadc1cb8698621f802c0d9f9a3c3c295c810748fb048115c186ec";
  var KEY = "jiaye_auth_guest_v1";
  var gate = document.getElementById("gate");
  if (sessionStorage.getItem(KEY)) { gate.classList.add("gate-hide"); return; }
  gate.classList.remove("gate-hide");
  document.body.style.overflow = "hidden";
  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("gate-pw").value;
    var err = document.getElementById("gate-err");
    err.classList.add("hide");
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw)).then(function (buf) {
      var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      if (hex === HASH) {
        sessionStorage.setItem(KEY, "1");
        gate.classList.add("gate-hide");
        document.body.style.overflow = "";
      } else {
        err.classList.remove("hide");
        document.getElementById("gate-pw").value = "";
      }
    }).catch(function () { err.classList.remove("hide"); });
  });
})();
</script>
</body>
</html>
